name: Nightly Validate

# Accuracy-assurance plan §4 Layer 4 — unattended backstop. Calls
# GET /api/scan/validate for each active season and fails / annotates the run
# when drift exceeds the threshold. The endpoint runs full cheap cache checks
# (POs, vendor returns, sales, rollup dollars) and keeps live on-hand bounded to
# a deterministic sample, so nightly validation does not issue thousands of LS
# product inventory calls. GitHub's built-in notifications email the repo owner
# on failure, so no SMTP infra is needed.
# In-app Data Health remains the PRIMARY surface; this is the automated backstop.

on:
  schedule:
    # 7:30am UTC = ~2:30am Central — after the nightly full scan has settled.
    - cron: "30 7 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate active seasons against Lightspeed
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # No `set -e`: a transient curl timeout or non-JSON body (e.g. a Vercel
        # function-timeout page) must NOT crash the job — only a genuine drift
        # result fails the run. Mirrors the hardened curl/jq pattern in
        # weekly-full-scan.yml.
        run: |
          set +e
          BASE="https://abersons-flow-report.vercel.app"

          # Active seasons = current year ±1 (matches lib/seasons currentSeasons():
          # any season whose year >= currentYear-1). Computed from the clock so
          # this stays correct across years without editing the workflow.
          Y=$(date -u +%Y)
          SEASONS=""
          for y in $((Y-1)) $Y $((Y+1)); do
            if [ "$y" -lt 2025 ]; then continue; fi
            yy=$(printf '%02d' $((y % 100)))
            if [ "$y" -le 2026 ]; then
              SEASONS="$SEASONS fall$yy spring$yy"
            else
              SEASONS="$SEASONS fall$yy prefall$yy spring$yy prespring$yy"
            fi
          done
          echo "Active seasons:$SEASONS"

          TRIPPED=0
          ERRORED=0
          MAX_SCAN_AGE_MS=$(( 36 * 60 * 60 * 1000 ))
          {
            echo "# Nightly Validate"
            echo ""
            echo "| Season | Drift | Checked | Drifted | Hard qty | Retail drift |"
            echo "| --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for season in $SEASONS; do
            echo "--- Validating $season ($(date -u +%H:%M:%S) UTC) ---"
            BODY_FILE=$(mktemp)
            HTTP_STATUS=$(curl -sS --max-time 120 -o "$BODY_FILE" -w "%{http_code}" \
              "$BASE/api/scan/validate?season=$season&sample=150" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Accept: application/json")
            CURL_RC=$?
            RESPONSE=$(<"$BODY_FILE")
            rm -f "$BODY_FILE"
            if [ "$CURL_RC" -ne 0 ]; then
              echo "::error::curl failed for $season (rc=$CURL_RC)."
              echo "| $season | ❌ unreachable | - | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
              ERRORED=$((ERRORED+1))
              continue
            fi
            if ! printf '%s' "$RESPONSE" | jq -e . >/dev/null 2>&1; then
              echo "::error::Non-JSON response for $season (HTTP $HTTP_STATUS): ${RESPONSE:0:200}"
              echo "| $season | ❌ bad response | - | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
              ERRORED=$((ERRORED+1))
              continue
            fi
            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              ERRMSG=$(printf '%s' "$RESPONSE" | jq -r '.error // .message // "request failed"')
              echo "::error::$season validation HTTP $HTTP_STATUS: $ERRMSG"
              echo "| $season | ❌ HTTP $HTTP_STATUS | - | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
              ERRORED=$((ERRORED+1))
              continue
            fi

            DRIFT=$(printf '%s' "$RESPONSE" | jq -r '.drift.tripped // false')
            CHECKED=$(printf '%s' "$RESPONSE" | jq -r '.counts.checkedProducts // 0')
            SOURCE_PRODUCTS=$(printf '%s' "$RESPONSE" | jq -r '.sourceProducts // 0')
            SCAN_COMPLETED_AT=$(printf '%s' "$RESPONSE" | jq -r '.scanCompletedAt // 0')
            DRIFTED=$(printf '%s' "$RESPONSE" | jq -r '.counts.driftedProducts // 0')
            HARD=$(printf '%s' "$RESPONSE" | jq -r '.counts.hardQtyMismatches // 0')
            RETAIL=$(printf '%s' "$RESPONSE" | jq -r '(.counts.seasonRetailDriftRatio // 0) * 100 | (. * 100 | round) / 100')
            NOW_MS=$(( $(date +%s) * 1000 ))

            if [ "$SCAN_COMPLETED_AT" -le 0 ] || [ $(( NOW_MS - SCAN_COMPLETED_AT )) -gt "$MAX_SCAN_AGE_MS" ]; then
              echo "::error::$season scan is missing or older than 36 hours."
              echo "| $season | ❌ stale scan | $CHECKED | $DRIFTED | $HARD | ${RETAIL}% |" >> "$GITHUB_STEP_SUMMARY"
              ERRORED=$((ERRORED+1))
              continue
            fi
            if [ "$SOURCE_PRODUCTS" -gt 0 ] && [ "$CHECKED" -eq 0 ]; then
              echo "::error::$season validated zero products despite $SOURCE_PRODUCTS source products."
              echo "| $season | ❌ zero coverage | 0 | $DRIFTED | $HARD | ${RETAIL}% |" >> "$GITHUB_STEP_SUMMARY"
              ERRORED=$((ERRORED+1))
              continue
            fi

            if [ "$DRIFT" = "true" ]; then
              REASONS=$(printf '%s' "$RESPONSE" | jq -r '[.drift.reasons[]?.detail] | join("; ")')
              echo "::error::Drift in $season: $REASONS"
              echo "| $season | ❌ DRIFT | $CHECKED | $DRIFTED | $HARD | ${RETAIL}% |" >> "$GITHUB_STEP_SUMMARY"
              TRIPPED=$((TRIPPED+1))
            else
              echo "$season OK (checked=$CHECKED drifted=$DRIFTED hard=$HARD retail=${RETAIL}%)"
              echo "| $season | ✅ ok | $CHECKED | $DRIFTED | $HARD | ${RETAIL}% |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Seasons with drift: $TRIPPED; unreachable/errored: $ERRORED" >> "$GITHUB_STEP_SUMMARY"

          if [ "$TRIPPED" -gt 0 ] || [ "$ERRORED" -gt 0 ]; then
            echo "Validation failed: drift=$TRIPPED request/staleness errors=$ERRORED."
            exit 1
          fi
          echo "No drift detected."
          exit 0
