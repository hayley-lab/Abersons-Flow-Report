name: Nightly Incremental Scan

on:
  schedule:
    # 4:30am UTC = ~11:30pm Central
    - cron: "30 4 * * *"
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Drive scans to completion
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Starting nightly incremental scan loop..."
          # Loop until the orchestrator reports allDone, guarded by a wall clock
          # that stays within timeout-minutes: 360 (340 min budget).
          DEADLINE=$(( $(date +%s) + 340 * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$(( i + 1 ))
            echo "--- Call $i ---"
            RESPONSE=$(curl -s -X POST "https://abersons-flow-report.vercel.app/api/cron/scan" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json")
            echo "$RESPONSE" | jq . || true
            ALL_DONE=$(echo "$RESPONSE" | jq -r '.allDone // false')
            if [ "$ALL_DONE" = "true" ]; then
              echo "All seasons complete. Done."
              exit 0
            fi
            echo "Seasons still in progress, continuing..."
          done
          echo "Reached time budget — scan may still be in progress."
