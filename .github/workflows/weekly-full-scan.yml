name: Weekly Full Scan

on:
  schedule:
    # 5:30am UTC Sunday = ~12:30am Central
    - cron: "30 5 * * 0"
  workflow_dispatch:
    inputs:
      consign_reset:
        description: "Force a cold rebuild of the store-wide consignment cache"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Drive full scans to completion
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # No `set -e`: a transient curl timeout or a non-JSON body (e.g. a Vercel
        # function-timeout page) must NOT abort the rebuild loop. We handle every
        # failure explicitly and keep looping until allDone or the wall clock.
        run: |
          set +e
          echo "Starting weekly full scan loop..."
          # Loop until the orchestrator reports allDone, guarded by a wall clock
          # that stays within timeout-minutes: 360 (340 min budget).
          DEADLINE=$(( $(date +%s) + 340 * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$(( i + 1 ))
            echo "--- Call $i ($(date -u +%H:%M:%S) UTC) ---"
            # Only the first call requests a fresh rebuild; the API persists that
            # intent so subsequent (query-less) calls still rebuild every season
            # once the shared catalog finishes building.
            if [ "$i" = "1" ]; then
              QUERY="?restart=1"
              # A manual dispatch with consign_reset=true cold-rebuilds the
              # store-wide consignment cache; the scheduled cron leaves this
              # false so consignment paging stays incremental.
              if [ "${{ inputs.consign_reset }}" = "true" ]; then
                QUERY="$QUERY&consign=1"
              fi
            else
              QUERY=""
            fi
            RESPONSE=$(curl -sS --max-time 295 -X POST "https://abersons-flow-report.vercel.app/api/cron/scan$QUERY" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json")
            CURL_RC=$?
            if [ "$CURL_RC" -ne 0 ]; then
              echo "curl failed (rc=$CURL_RC) — likely a function timeout; treating as not done, continuing."
              sleep 5
              continue
            fi
            # Parse only when the body is valid JSON; otherwise log a snippet and
            # treat as "not done" so a single bad response never crashes the job.
            if printf '%s' "$RESPONSE" | jq -e . >/dev/null 2>&1; then
              printf '%s' "$RESPONSE" | jq -c '{ok, allDone, catalogBuilding, catalog, results}' 2>/dev/null \
                || printf '%s\n' "$RESPONSE"
              ALL_DONE=$(printf '%s' "$RESPONSE" | jq -r '.allDone // false' 2>/dev/null)
            else
              echo "(non-JSON/timeout response: ${RESPONSE:0:200})"
              ALL_DONE=false
            fi
            if [ "$ALL_DONE" = "true" ]; then
              echo "All seasons complete. Done."
              exit 0
            fi
            echo "Still in progress (catalog building or seasons stepping), continuing..."
            sleep 3
          done
          echo "Reached time budget — scan may still be in progress."
