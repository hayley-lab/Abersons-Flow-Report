name: Weekly Full Scan

on:
  schedule:
    # 5:30am UTC Sunday = ~12:30am Central
    - cron: "30 5 * * 0"
  workflow_dispatch:
    inputs:
      resume_existing:
        description: "Resume persisted scan state instead of starting a fresh rebuild"
        type: boolean
        default: false
      catalog_reset:
        description: "Force a cold rebuild of the store-wide catalog cache (re-derives every product's vendor/brand)"
        type: boolean
        default: false
      consign_reset:
        description: "Force a cold rebuild of the store-wide consignment cache"
        type: boolean
        default: false
      sales_reset:
        description: "Force a cold rebuild of the store-wide sales cache (fixes sale vs on-sale classification)"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Drive full scans to completion
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # No `set -e`: a transient curl timeout or a non-JSON body (e.g. a Vercel
        # function-timeout page) must NOT abort the rebuild loop. We handle every
        # failure explicitly and keep looping until allDone or the wall clock.
        run: |
          set +e
          echo "Starting weekly full scan loop..."
          # Loop until the orchestrator reports allDone, guarded by a wall clock
          # that stays within timeout-minutes: 360 (340 min budget).
          DEADLINE=$(( $(date +%s) + 340 * 60 ))
          i=0
          # Stall guard: abort early if many consecutive calls make no progress
          # (no cache still building AND no season advanced) instead of silently
          # looping to the 340-min wall clock. ~15 calls ≈ 13+ minutes of nothing.
          STALL=0
          STALL_LIMIT=15
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$(( i + 1 ))
            echo "--- Call $i ($(date -u +%H:%M:%S) UTC) ---"
            # Every call uses driver=1: cron-authenticated and cache-gated like the
            # scheduled route, but intentionally short so Actions receives JSON
            # progress instead of waiting near Vercel's function timeout.
            if [ "$i" = "1" ]; then
              if [ "${{ inputs.resume_existing }}" = "true" ]; then
                QUERY="?driver=1"
              else
                QUERY="?driver=1&refresh=1&restart=1"
                # A manual dispatch with catalog_reset=true cold-rebuilds the
                # store-wide catalog cache (?catalog=1 → driveCatalog resets, then
                # re-buckets every season), re-deriving every product's
                # vendor/brand attribution. The scheduled cron leaves this false
                # so catalog paging stays incremental (changed products only).
                if [ "${{ inputs.catalog_reset }}" = "true" ]; then
                  QUERY="$QUERY&catalog=1"
                fi
                # A manual dispatch with consign_reset=true cold-rebuilds the
                # store-wide consignment cache; the scheduled cron leaves this
                # false so consignment paging stays incremental.
                if [ "${{ inputs.consign_reset }}" = "true" ]; then
                  QUERY="$QUERY&consign=1"
                fi
                # A manual dispatch with sales_reset=true cold-rebuilds the
                # store-wide sales cache (driveSales resets on ?sales=1, then loops
                # to cacheComplete), correcting sale vs on-sale classification. The
                # scheduled cron leaves this false so sales paging stays incremental.
                if [ "${{ inputs.sales_reset }}" = "true" ]; then
                  QUERY="$QUERY&sales=1"
                fi
              fi
            else
              QUERY="?driver=1"
            fi
            RESPONSE=$(curl -sS --max-time 180 -X POST "https://abersons-flow-report.vercel.app/api/cron/scan$QUERY" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json")
            CURL_RC=$?
            if [ "$CURL_RC" -ne 0 ]; then
              echo "curl failed (rc=$CURL_RC) — likely a function timeout; treating as not done, continuing."
              sleep 5
              continue
            fi
            # Parse only when the body is valid JSON; otherwise log a snippet and
            # treat as "not done" so a single bad response never crashes the job.
            if printf '%s' "$RESPONSE" | jq -e . >/dev/null 2>&1; then
              printf '%s' "$RESPONSE" | jq -c '{ok, allDone, cacheRefreshPending, pendingCacheRefreshes, cacheRefreshProgress, catalogBuilding, salesBuilding, consignBuilding, inventoryBuilding, results}' 2>/dev/null \
                || printf '%s\n' "$RESPONSE"
              ALL_DONE=$(printf '%s' "$RESPONSE" | jq -r '.allDone // false' 2>/dev/null)
              HAS_ERROR=$(printf '%s' "$RESPONSE" | jq -r 'any(.results[]?; (.action == "error") or (.phase == "error"))' 2>/dev/null)
              # Progress = a shared cache is still building OR at least one season
              # advanced this call (any non-skipped result). Used by the stall guard.
              BUILDING=$(printf '%s' "$RESPONSE" | jq -r '((.cacheRefreshPending // false) or (.catalogBuilding // false) or (.salesBuilding // false) or (.consignBuilding // false) or (.inventoryBuilding // false))' 2>/dev/null)
              ADVANCED=$(printf '%s' "$RESPONSE" | jq -r 'any(.results[]?; .action == "advanced")' 2>/dev/null)
            else
              echo "(non-JSON/timeout response: ${RESPONSE:0:200})"
              ALL_DONE=false
              HAS_ERROR=false
              BUILDING=false
              ADVANCED=false
            fi
            if [ "$ALL_DONE" = "true" ]; then
              if [ "$HAS_ERROR" = "true" ]; then
                echo "Scan reported completion with errored season(s); failing."
                exit 1
              fi
              echo "All seasons complete. Done."
              exit 0
            fi
            if [ "$BUILDING" = "true" ] || [ "$ADVANCED" = "true" ]; then
              STALL=0
            else
              STALL=$(( STALL + 1 ))
              if [ "$STALL" -ge "$STALL_LIMIT" ]; then
                echo "No progress for $STALL consecutive calls (no cache building, no season advanced)."
                echo "Last response: ${RESPONSE:0:500}"
                echo "Aborting instead of looping to the wall clock."
                exit 1
              fi
            fi
            echo "Still in progress (catalog building or seasons stepping), continuing... (stall=$STALL)"
            sleep 3
          done
          echo "Reached time budget — scan may still be in progress."
          exit 1
