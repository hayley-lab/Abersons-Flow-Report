name: Delta Scan (Quick Refresh)
on:
  schedule:
    # Every hour Tue–Sat 10am–5pm Central (15:00–22:00 UTC, days 2–6)
    - cron: "0 15,16,17,18,19,20,21,22 * * 2-6"
  workflow_dispatch:

jobs:
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger delta scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s -X POST "https://abersons-flow-report.vercel.app/api/cron/delta" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" | jq .
