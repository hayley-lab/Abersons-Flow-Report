name: Nightly Scan

on:
  schedule:
    # 4:30am UTC = ~11:30pm Central
    - cron: "30 4 * * *"
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Drive scans to completion
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Starting nightly scan loop..."
          for i in $(seq 1 600); do
            echo "--- Call $i ---"
            curl -s -X POST "https://abersons-flow-report.vercel.app/api/cron/scan" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" | jq . || true
            sleep 12
          done
          echo "Scan loop complete."
