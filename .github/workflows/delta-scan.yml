name: Delta Scan (Quick Refresh)
on:
  schedule:
    # Every 10 min Mon–Sat 10am–5:30pm Central (15:00–22:30 UTC, days 1–6)
    - cron: "*/10 15-22 * * 1-6"
  workflow_dispatch:

jobs:
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger delta scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s -X POST "https://abersons-flow-report.vercel.app/api/cron/delta" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" | jq .
