name: Nightly Scan

on:
  schedule:
    # 4:30am UTC = ~11:30pm Central
    - cron: "30 4 * * *"
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Drive scans to completion
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Starting nightly scan loop..."
          for i in $(seq 1 20); do
            echo "--- Call $i ---"
            # First call uses ?restart=1 to force a fresh rescan of all seasons.
            # Subsequent calls advance in-progress seasons without restarting.
            if [ "$i" = "1" ]; then
              QUERY="?restart=1"
            else
              QUERY=""
            fi
            RESPONSE=$(curl -s -X POST "https://abersons-flow-report.vercel.app/api/cron/scan$QUERY" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json")
            echo "$RESPONSE" | jq . || true
            ALL_DONE=$(echo "$RESPONSE" | jq -r '.allDone // false')
            if [ "$ALL_DONE" = "true" ]; then
              echo "All seasons complete. Done."
              exit 0
            fi
            echo "Seasons still in progress, continuing..."
          done
          echo "Reached iteration limit — scan may still be in progress."
